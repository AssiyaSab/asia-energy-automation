<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
    <pattern id="grid-sub" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#f8fafc"/>
  <rect width="800" height="500" fill="url(#grid-sub)"/>
  
  <!-- Schematic graphic -->
  <g transform="translate(100, 70)" stroke="#0284c7" stroke-width="2" fill="none">
    <!-- Controller Unit -->
    <rect x="200" y="80" width="200" height="160" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="drop-shadow(0 4px 12px rgba(2,132,199,0.15))"/>
    <text x="300" y="140" font-family="monospace" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle" stroke="none">ПТК PREMIER</text>
    <text x="300" y="170" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle" stroke="none">МОДУЛЬ АСУ ТП / PLC</text>
    <circle cx="230" cy="105" r="5" fill="#10b981" stroke="none"/>
    <circle cx="250" cy="105" r="5" fill="#f59e0b" stroke="none"/>
    <circle cx="270" cy="105" r="5" fill="#0284c7" stroke="none"/>

    <!-- Inputs and lines -->
    <path d="M 50 120 L 200 120" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="50" cy="120" r="16" fill="#ffffff" stroke="#f59e0b"/>
    <text x="50" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle" stroke="none">КИП</text>

    <path d="M 50 200 L 200 200" stroke="#0284c7" stroke-width="2"/>
    <circle cx="50" cy="200" r="16" fill="#ffffff" stroke="#0284c7"/>
    <text x="50" y="205" font-family="monospace" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle" stroke="none">10kV</text>

    <!-- Outputs -->
    <path d="M 400 120 L 550 120" stroke="#10b981" stroke-width="2"/>
    <circle cx="550" cy="120" r="16" fill="#ffffff" stroke="#10b981"/>
    <text x="550" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle" stroke="none">ЗРА</text>

    <path d="M 400 200 L 550 200" stroke="#0284c7" stroke-width="2"/>
    <circle cx="550" cy="200" r="16" fill="#ffffff" stroke="#0284c7"/>
    <text x="550" y="205" font-family="monospace" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle" stroke="none">HMI</text>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(400, 390)">
    <rect x="-240" y="-20" width="480" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">
      ТЕХНИЧЕСКАЯ СХЕМА АСУ ТП · ИСПОЛНИТЕЛЬНАЯ ДОКУМЕНТАЦИЯ АЭА
    </text>
  </g>
</svg>
